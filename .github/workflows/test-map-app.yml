name: Map application tests

on:
  push:
    paths:
      - "MapApp/**"
      - "NovaApi/**"
      - "Auth/**"
      - "migrations/**"
      - "tests/**"
      - "scripts/**"
      - "main.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "compose.host-auth.yaml"
      - ".github/workflows/test-map-app.yml"
  pull_request:
    paths:
      - "MapApp/**"
      - "NovaApi/**"
      - "Auth/**"
      - "migrations/**"
      - "tests/**"
      - "scripts/**"
      - "main.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "compose.host-auth.yaml"
      - ".github/workflows/test-map-app.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python tests (Google network disabled by fakes)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check MapApp/static/app.js
      - name: Container definition
        run: |
          docker compose config --quiet
          docker compose --profile real --profile test config --quiet
          touch /tmp/gfmt-empty-secrets.json
          GFMT_HOST_AUTH_FILE=/tmp/gfmt-empty-secrets.json docker compose -f compose.yaml -f compose.host-auth.yaml --profile real config --quiet
      - name: Secret-pattern regression scan
        shell: bash
        run: |
          if rg -l -i '(AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ya29\.[0-9A-Za-z_-]+|gh[pousr]_[0-9A-Za-z]{20,})' MapApp tests scripts main.py Dockerfile compose.yaml compose.host-auth.yaml .dockerignore; then
            exit 1
          fi
